<!DOCTYPE html>
<html>

<head>
    <title>Guess THe number</title>
    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <div id="wrapper">
        <div class="header">
        <h1>Number Guessing game</h1>
        <p>Try and guess a random number between 1 and 100</p>
        <p>You have 10 attempts to guess the right number</p>
        </div>
        <form>
            <label for="guessfiled" id="guess">Guess a number</label>
            </br>
            </br>
            <input type="text" id="userInput" class="guessField">
            </br>
            </br>
            <input type="submit" id="submit" value="Submit guess" class="guessSubmit">
        </form>

        <div class="resultParas">
            <p>Previours Gussess <span class="guessSlot"></span></p>
            <p>Guesses Remaining : <span class="lastResult">10</span></p>
            <p class="lowerOrHeigh" ></p>
        </div>

    </div>

    <script src="./index.js"></script>
</body>

</html>
